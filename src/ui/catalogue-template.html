<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>capcut-david — cartographie du catalogue</title>
<style>
  :root { --bg:#111418; --card:#1b2026; --tx:#e8eaed; --dim:#9aa0a6; --acc:#4dabf7;
          --ro:#37b24d; --wr:#f59f00; --warn:#e03131; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--tx); }
  header { padding:20px 28px; border-bottom:1px solid #2a3038; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; } header .v { color:var(--acc); font-weight:600; }
  header .d { color:var(--dim); font-size:13px; word-break:break-all; }
  #bar { padding:14px 28px; display:flex; gap:10px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); border-bottom:1px solid #2a3038; }
  #q { flex:1; min-width:220px; padding:8px 12px; border-radius:8px; border:1px solid #2a3038; background:var(--card); color:var(--tx); }
  .cat-btn { padding:6px 12px; border-radius:16px; border:1px solid #2a3038; background:var(--card); color:var(--tx); cursor:pointer; }
  .cat-btn.on { background:var(--acc); color:#08121e; border-color:var(--acc); }
  main { padding:20px 28px; max-width:1100px; margin:0 auto; }
  h2.cat { margin:28px 0 10px; font-size:16px; color:var(--acc); text-transform:uppercase; letter-spacing:.06em; }
  .card { background:var(--card); border:1px solid #2a3038; border-radius:10px; padding:14px 16px; margin:10px 0; }
  .card h3 { margin:0 0 4px; font-size:16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid; }
  .b-ro { color:var(--ro); border-color:var(--ro); } .b-wr { color:var(--wr); border-color:var(--wr); }
  .b-cc { color:var(--warn); border-color:var(--warn); } .b-v { color:var(--dim); border-color:var(--dim); }
  .sig { font-family:Consolas,monospace; font-size:13px; color:var(--dim); margin:4px 0 8px; word-break:break-all; }
  .note { margin:6px 0; padding:8px 10px; border-left:3px solid var(--wr); background:#0d1117; border-radius:0 6px 6px 0; white-space:pre-wrap; }
  .meta { font-size:13px; color:var(--dim); margin:4px 0; }
  .meta code { color:var(--acc); font-family:Consolas,monospace; }
  details { margin-top:6px; font-size:13px; }
  summary { cursor:pointer; color:var(--dim); }
  details li { font-family:Consolas,monospace; font-size:12px; word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>capcut-david — cartographie du catalogue</h1>
  <span class="v" id="total"></span><span class="d" id="built"></span>
</header>
<div id="bar">
  <input id="q" type="search" placeholder="Rechercher une ressource, un id, une note… (ex : Rubik, 7034, VIP)">
  <!-- boutons kinds injectés par JS -->
</div>
<main>
  <p class="meta">Source : <code id="src"></code> · régénéré par <code>capcut-david catalogue</code> (sync/add) et <code>npm run build</code>. Les entrées multi-familles apparaissent sous chaque kind qu'elles portent.</p>
  <section id="entries"></section>
</main>
<script>
/*__DATA__*/
document.getElementById("total").textContent = "" + DATA.entries.length + (DATA.entries.length > 1 ? " entrées" : " entrée");
document.getElementById("built").textContent = "généré le " + DATA.builtAt;
document.getElementById("src").textContent = DATA.source;

const bar = document.getElementById("bar");
const active = new Set();
for (const k of DATA.kindOrder) {
  const n = DATA.entries.filter(e => e.kinds.includes(k)).length;
  const b = document.createElement("button");
  b.className = "cat-btn"; b.textContent = k + " (" + n + ")"; b.dataset.kind = k;
  b.onclick = () => { b.classList.toggle("on"); b.classList.contains("on") ? active.add(k) : active.delete(k); render(); };
  bar.appendChild(b);
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
// Graisse (Thin/Regular/Bold...) : dérivable du nom, contrairement à la
// classification (Serif/Sans Serif/Slab Serif/Script/Display) qui est un
// jugement visuel — celle-là vit dans le champ éditorial `classification`.
const FONT_WEIGHTS = ["Thin","ExtraLight","UltraLight","Light","Regular","Normal","Medium",
  "SemiBold","DemiBold","Bold","ExtraBold","UltraBold","Black","Heavy","Italic","BoldItalic"];
function deriveWeight(name){
  const m = name.match(/^(.+?)[\s_-]+([A-Za-z]+)$/);
  return m && FONT_WEIGHTS.some(w => w.toLowerCase() === m[2].toLowerCase()) ? m[2] : "";
}
function card(e){
  const local = e.id.startsWith("local:") || e.id.startsWith("unresolved:");
  const badges = [
    local ? '<span class="badge b-cc">sans id catalogue</span>' : "",
    e.witness_drafts.length ? '<span class="badge b-ro">' + e.witness_drafts.length + " témoin(s)</span>" : "",
    e.ignored ? '<span class="badge b-cc">ignorée</span>' : "",
  ].join(" ");
  const aliases = e.names.slice(1);
  const isFont = e.kinds.includes("font");
  const weight = isFont ? deriveWeight(e.names[0] || "") : "";
  const detail = (arr, label) => arr.length
    ? "<details><summary>" + label + " (" + arr.length + ")</summary><ul>" + arr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></details>"
    : "";
  return '<div class="card"><h3>' + esc(e.names[0] || "(sans nom)") + " " + badges + '</h3>'
    + '<div class="sig">' + esc(e.id) + '</div>'
    + (isFont && (e.classification || weight) ? '<div class="meta">'
        + (e.classification ? 'classification <code>' + esc(e.classification) + '</code>' : 'classification <code>?</code>')
        + (weight ? ' · graisse <code>' + esc(weight) + '</code>' : '')
        + '</div>' : "")
    + (aliases.length ? '<div class="meta">alias : ' + aliases.map(esc).join(", ") + "</div>" : "")
    + (e.note ? '<div class="note">' + esc(e.note) + "</div>" : "")
    + '<div class="meta">vu depuis <code>' + esc(e.first_seen) + "</code>"
    + (e.resource_id ? ' · resource_id <code>' + esc(e.resource_id) + "</code>" : "")
    + (e.effect_id && e.effect_id !== e.resource_id ? ' · effect_id <code>' + esc(e.effect_id) + "</code>" : "") + "</div>"
    + detail(e.witness_drafts, "drafts témoins")
    + detail(e.font_paths, "font_paths")
    + "</div>";
}
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let html = "";
  for (const k of DATA.kindOrder) {
    const es = DATA.entries.filter(e => e.kinds.includes(k))
      .filter(e => !active.size || active.has(k))
      .filter(e => !q || (e.id+" "+e.names.join(" ")+" "+e.note+" "+e.resource_id+" "+e.first_seen).toLowerCase().includes(q));
    if (es.length) html += '<h2 class="cat">' + esc(k) + " (" + es.length + ")</h2>" + es.map(card).join("");
  }
  // Entrées sans kind (rare, mais ne pas les avaler en silence)
  const sans = DATA.entries.filter(e => e.kinds.length === 0)
    .filter(e => !q || (e.id+" "+e.names.join(" ")+" "+e.note).toLowerCase().includes(q));
  if (!active.size && sans.length) html += '<h2 class="cat">sans kind (' + sans.length + ")</h2>" + sans.map(card).join("");
  document.getElementById("entries").innerHTML = html || "<p>Aucune entrée ne correspond.</p>";
}
document.getElementById("q").oninput = render;
render();
</script>
</body>
</html>
